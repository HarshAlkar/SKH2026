databases:
  - name: vitalreach-db
    plan: free

services:
  - type: web
    name: vitalreach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: vitalreach-db
          property: connectionString
      - key: SIGNALING_NOTIFY_URL
        value: "https://vitalreach-signaling.onrender.com/notify"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: vitalreach-signaling
    runtime: docker
    dockerfilePath: ./realtime_server/node_signaling_server/Dockerfile
    dockerContext: ./realtime_server/node_signaling_server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
