; ESP32 emergency gateway firmware stub.
; Hardware is not required to compile this. Default transport is MOCK.
; Flash later with PlatformIO: pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7
build_flags =
  -DEMERGENCY_TRANSPORT_MOCK=1
